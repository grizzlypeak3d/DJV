[build-system]
# tlRender is pinned to one release, here and in the dependencies below, and
# feather-tk to the one that release pins: DJV is built against those wheels'
# headers and loads their libraries. A DJV release needs the tlRender it was
# built with on PyPI first. nanobind is the version feather-tk's module is
# built with; the modules share types only when they match.
requires = [
    "scikit-build-core>=0.11",
    "nanobind==3.0.1",
    "tlRender==0.22.0",
    "feather-tk==0.14.0",
]
build-backend = "scikit_build_core.build"

[project]
# "djv" on PyPI belongs to another project; this is the name of the
# subreddit, r/DJV_viewer. The package imports as djv and the command is djv
# all the same.
name = "DJV_viewer"
dynamic = ["version"]
description = "An open source application for media playback and review, for film, VFX, and animation"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Contributors to the DJV project" }]
keywords = ["vfx", "animation", "playback", "review", "image sequences", "opentimelineio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "tlRender==0.22.0",
]

[project.scripts]
djv = "djv:main"

[project.urls]
Homepage = "https://grizzlypeak3d.github.io/DJV/"
Documentation = "https://grizzlypeak3d.github.io/DJV/index.html"
Source = "https://github.com/grizzlypeak3d/DJV"
Issues = "https://github.com/grizzlypeak3d/DJV/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.31"
build-dir = "build-wheel/{wheel_tag}"
# One wheel for every CPython from 3.12 on.
wheel.py-api = "cp312"
# The wheel's contents come from the CMake install: the package directory
# is the install prefix, so the module, the application, its libraries and
# its documentation all land inside djv.
wheel.install-dir = "djv"
wheel.packages = []
# Not "dev": the headers, the static libraries and the CMake package are for
# building against DJV, which a wheel is not for.
install.components = ["runtime", "docs"]
# A wheel builds against the tlRender wheel, so the source distribution has
# no need of the submodule, or of the media only the packages carry.
sdist.exclude = [".github", "build-wheel", "dist", "deps", "etc/SampleData", "etc/Screenshots"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "lib/djv/Models/Version.h"
regex = '''(?s)DJV_VERSION_MAJOR (?P<major>\d+).*DJV_VERSION_MINOR (?P<minor>\d+).*DJV_VERSION_PATCH (?P<patch>\d+).*DJV_VERSION_DEV "(?P<dev>[^"]*)"'''
# "3.7.0-dev" normalizes to the PEP 440 "3.7.0.dev0".
result = "{major}.{minor}.{patch}{dev}"

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
# Each runner builds its own architecture only; "auto" adds 32-bit Windows
# and Linux, which are not supported.
archs = ["native"]
build-verbosity = 1
# The runners have no OpenGL; the tests that need it skip. The djv command
# printing its help is the application starting with every library found.
test-command = "python {project}/tests/run-python-tests.py && djv -h"
test-environment = { DJV_TESTS_NO_GL = "1" }
# tlRender's and feather-tk's libraries stay in their wheels; the script
# shows the repair tools where they are and has them left out.
repair-wheel-command = "python {project}/etc/Python/repair_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.linux]
# OpenGL for feather-tk's package to find. The images are AlmaLinux 8.
before-all = "dnf install -y mesa-libGL-devel mesa-libEGL-devel"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
repair-wheel-command = "python {project}/etc/Python/repair_wheel.py {wheel} {dest_dir} {delocate_archs}"
