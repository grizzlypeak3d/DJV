name: CI

on: [push]

jobs:
  linux-build:
    runs-on: ubuntu-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    # Writes the dependency cache that the pull request check reads. Only this
    # job caches: an entry is around 2.5GB compressed, and the 10GB limit is
    # repository-wide with least-recently-used eviction, so caching the rest of
    # the matrix could evict this entry and silently return the gate to a cold
    # twenty minute build.
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          install-Debug
          ftk-Debug
          tl-Debug
        key: deps-${{ runner.os }}-Debug-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/.github/workflows/ci-workflow.yml') }}

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh djv/etc/Linux/setup-gha.sh

    - name: Build
      run: |
        sh djv/etc/Linux/sbuild.sh djv Debug ci-linux

    # The command line page in the documentation is made from the
    # application's help and committed; this is where a stale one is caught.
    # Under xvfb because the application opens the video subsystem before it
    # reads its command line, so even printing the help needs a display.
    - name: Documentation check
      run: |
        xvfb-run cmake --build build-Debug --target djvDocsHelpCheck

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug

  # Against the distribution's packages rather than the super build: the
  # build docs/building.html describes under "System packages", and the one
  # a distribution package would make. Ubuntu 26.04, the first release with
  # the C++ OpenTimelineIO package, in a container because the runner images
  # lag the releases. lunasvg has no package and the script builds it.
  linux-system-build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    # The checkout needs git for the submodules, and a bare container has
    # none.
    - name: Install git
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y git
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    - name: Setup environment
      run: |
        cmake --version || true
        sh djv/etc/Linux/setup-gha-system.sh

    - name: Build
      run: |
        sh djv/etc/Linux/build-system.sh djv Release ci-linux

    - name: Run tests
      run: |
        cd build-Release
        xvfb-run ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Release

  # \bug Disable building OIIO; it seems there is an error when OCIO is disabled.

  linux-build-python:
    runs-on: ubuntu-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh djv/etc/Linux/setup-gha.sh

    - name: Build
      run: |
        sh djv/etc/Linux/sbuild.sh djv Debug ci-linux-python

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug

  # \bug Disable building OIIO; it seems there is an error when OCIO is disabled.
  linux-gles3-build:
    runs-on: ubuntu-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        python --version
        sh djv/etc/Linux/setup-gha.sh

    - name: Build
      run: |
        sh djv/etc/Linux/sbuild.sh djv Debug ci-linux-gles3

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug


  linux-package:
    runs-on: ubuntu-latest

    # Rocky Linux 8, so the package runs on what people actually have rather
    # than only on something as new as the runner: the runner's glibc is newer
    # than Rocky 8's, and a binary built against it will not start there.
    #
    # CY2025 rather than a later year because it is the newest that still
    # carries CMake 3.x. CMake 4 refuses the cmake_minimum_required that
    # several of the dependencies still declare.
    container: aswf/ci-base:2025

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    - name: Setup environment
      run: |
        echo "$PWD/install-Release/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Release/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh djv/etc/Linux/setup-gha-rocky.sh

    - name: Build
      run: |
        sh djv/etc/Linux/sbuild.sh djv Release package-linux

    # FFmpeg's configure reports every failed dependency check the same way,
    # and the reason is only in its own log.
    - name: FFmpeg configure log
      if: failure()
      run: tail -n 150 tl-Release/FFmpeg/src/FFmpeg/ffbuild/config.log

    - name: Package
      run: |
        cmake --build build-Release --config Release --target package

    - uses: actions/upload-artifact@v7
      with:
        name: DJV-Linux-Packages
        path: build-Release/djv-*.tar.gz
        archive: false

  macos-build:
    runs-on: macos-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version

    - name: Build
      run: |
        sh djv/etc/macOS/sbuild.sh djv Debug ci-macos

    # The runner has no working OpenGL, which djv-test does not need.
    - name: Run tests
      run: |
        cd build-Debug
        ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug


  macos-build-python:
    runs-on: macos-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version

    - name: Build
      run: |
        sh djv/etc/macOS/sbuild.sh djv Debug ci-macos-python

    # The runner has no working OpenGL, which djv-test does not need.
    - name: Run tests
      run: |
        cd build-Debug
        ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug
  macos-package:
    runs-on: macos-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Release/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Release/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version

    - name: Build
      run: |
        sh djv/etc/macOS/sbuild.sh djv Release package-macos

    - name: Package
      run: |
        cmake --build build-Release --config Release --target package

    - uses: actions/upload-artifact@v7
      with:
        name: DJV-macOS-Packages
        path: build-Release/djv-*.dmg
        archive: false

  windows-build:
    runs-on: windows-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: ilammy/setup-nasm@v1

    # \bug Any spaces before the ">>" will be considered part of the path.
    - name: Setup environment
      shell: cmd
      run: |
        echo %CD%\install-Debug\bin>> %GITHUB_PATH%
        echo %CD%\install-Debug\lib>> %GITHUB_PATH%
        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version
        
    - name: Build
      shell: cmd
      run: |
        djv\etc\Windows\sbuild.bat djv Debug ci-windows

    # The runner has no working OpenGL, which djv-test does not need.
    - name: Run tests
      shell: cmd
      run: |
        cd build-Debug
        ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug


  windows-build-python:
    runs-on: windows-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: ilammy/setup-nasm@v1

    # \bug Any spaces before the ">>" will be considered part of the path.
    - name: Setup environment
      shell: cmd
      run: |
        echo %CD%\install-Debug\bin>> %GITHUB_PATH%
        echo %CD%\install-Debug\lib>> %GITHUB_PATH%
        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version
        
    - name: Build
      shell: cmd
      run: |
        djv\etc\Windows\sbuild.bat djv Debug ci-windows-python

    # The runner has no working OpenGL, which djv-test does not need.
    - name: Run tests
      shell: cmd
      run: |
        cd build-Debug
        ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug
  windows-package:
    runs-on: windows-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: ilammy/setup-nasm@v1

    # \bug Any spaces before the ">>" will be considered part of the path.
    - name: Setup environment
      shell: cmd
      run: |
        echo %CD%\install-Release\bin>> %GITHUB_PATH%
        echo %CD%\install-Release\lib>> %GITHUB_PATH%
        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version
        winget install NSIS.NSIS --accept-package-agreements --accept-source-agreements --disable-interactivity

    - name: Build
      shell: cmd
      run: |
        djv\etc\Windows\sbuild.bat djv Release package-windows

    - name: Package
      shell: cmd
      run: |
        cmake --build build-Release --config Release --target package

    - uses: actions/upload-artifact@v7
      with:
        name: DJV-Windows-Packages
        path: |
          build-Release\djv-*.exe
          build-Release\djv-*.zip
        archive: true
