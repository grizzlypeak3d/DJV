name: CI

# Every push; and by hand from the Actions tab, which is how a signed Windows
# package is made without a release (see the windows-package job).
on:
  push:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the Windows packages
        type: boolean
        default: false

jobs:
  linux-build:
    runs-on: ubuntu-24.04

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Debug
        key: deps-${{ runner.os }}-${{ runner.arch }}-Debug-ci-linux-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/Linux/sbuild.sh', 'djv/etc/Linux/setup-gha*.sh') }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh djv/etc/Linux/setup-gha.sh

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      env:
        SBUILD_STAGES: deps
      run: |
        sh djv/etc/Linux/sbuild.sh djv Debug ci-linux

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Debug
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      env:
        SBUILD_STAGES: project
      run: |
        sh djv/etc/Linux/sbuild.sh djv Debug ci-linux

    # The command line page in the documentation is made from the
    # application's help and committed; this is where a stale one is caught.
    - name: Documentation check
      run: |
        cmake --build build-Debug --target djvDocsHelpCheck
        # The application makes its window to list the menus: a display.
        xvfb-run cmake --build build-Debug --target djvDocsActionsCheck
        cmake --build build-Debug --target djvDocsPagesCheck

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug

  # Against the distribution's packages rather than the super build: the
  # build docs/building.html describes under "System packages", and the one
  # a distribution package would make. Ubuntu 26.04, the first release with
  # the C++ OpenTimelineIO package, in a container because the runner images
  # lag the releases. lunasvg has no package and the script builds it.
  linux-system-build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    # The checkout needs git for the submodules, and a bare container has
    # none.
    - name: Install git
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y git
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    - name: Setup environment
      run: |
        cmake --version || true
        sh djv/etc/Linux/setup-gha-system.sh

    - name: Build
      run: |
        sh djv/etc/Linux/build-system.sh djv Release ci-linux

    - name: Run tests
      run: |
        cd build-Release
        xvfb-run ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Release

    # This build packages without the super build's libraries, which is the
    # part of packaging nothing else here covers: the package target went
    # missing from it for a fortnight before anyone noticed (#889).
    - name: Package
      run: |
        cmake --build build-Release --target package
        ls build-Release/djv-*.tar.gz

  # \bug Disable building OIIO; it seems there is an error when OCIO is disabled.

  linux-build-python:
    runs-on: ubuntu-24.04

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Debug
        key: deps-${{ runner.os }}-${{ runner.arch }}-Debug-ci-linux-python-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/Linux/sbuild.sh', 'djv/etc/Linux/setup-gha*.sh') }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh djv/etc/Linux/setup-gha.sh

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      env:
        SBUILD_STAGES: deps
      run: |
        sh djv/etc/Linux/sbuild.sh djv Debug ci-linux-python

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Debug
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      env:
        SBUILD_STAGES: project
      run: |
        sh djv/etc/Linux/sbuild.sh djv Debug ci-linux-python

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug

  # \bug Disable building OIIO; it seems there is an error when OCIO is disabled.
  linux-gles3-build:
    runs-on: ubuntu-24.04

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      # The graphics API is chosen when the program starts, and falls back
      # to OpenGL where OpenGL ES cannot be had. Asking for it by name
      # leaves no fallback, so this job fails rather than test the other.
      FTK_GL_API: GLES_3

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Debug
        key: deps-${{ runner.os }}-${{ runner.arch }}-Debug-ci-linux-gles3-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/Linux/sbuild.sh', 'djv/etc/Linux/setup-gha*.sh') }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        python --version
        sh djv/etc/Linux/setup-gha.sh

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      env:
        SBUILD_STAGES: deps
      run: |
        sh djv/etc/Linux/sbuild.sh djv Debug ci-linux-gles3

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Debug
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      env:
        SBUILD_STAGES: project
      run: |
        sh djv/etc/Linux/sbuild.sh djv Debug ci-linux-gles3

    - name: Run tests
      run: |
        cd build-Debug
        xvfb-run ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug


  linux-package:
    runs-on: ubuntu-24.04

    # Rocky Linux 8, so the package runs on what people actually have rather
    # than only on something as new as the runner: the runner's glibc is newer
    # than Rocky 8's, and a binary built against it will not start there.
    #
    # CY2025 rather than a later year because it is the newest that still
    # carries CMake 3.x. CMake 4 refuses the cmake_minimum_required that
    # several of the dependencies still declare.
    container: aswf/ci-base:2025

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Release
        key: deps-${{ runner.os }}-${{ runner.arch }}-Release-package-linux-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/Linux/sbuild.sh', 'djv/etc/Linux/setup-gha*.sh') }}

    - name: Setup environment
      run: |
        echo "$PWD/install-Release/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Release/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh djv/etc/Linux/setup-gha-rocky.sh

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      env:
        SBUILD_STAGES: deps
      run: |
        sh djv/etc/Linux/sbuild.sh djv Release package-linux

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Release
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      env:
        SBUILD_STAGES: project
      run: |
        sh djv/etc/Linux/sbuild.sh djv Release package-linux

    # FFmpeg's configure reports every failed dependency check the same way,
    # and the reason is only in its own log.
    - name: FFmpeg configure log
      if: failure()
      run: tail -n 150 tl-Release/FFmpeg/src/FFmpeg/ffbuild/config.log

    - name: Package
      run: |
        cmake --build build-Release --config Release --target package

    - uses: actions/upload-artifact@v7
      with:
        name: DJV-Linux-Packages
        path: build-Release/djv-*.tar.gz
        archive: false

  macos-build:
    runs-on: macos-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Debug
        key: deps-${{ runner.os }}-${{ runner.arch }}-Debug-ci-macos-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/macOS/sbuild.sh') }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      env:
        SBUILD_STAGES: deps
      run: |
        sh djv/etc/macOS/sbuild.sh djv Debug ci-macos

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Debug
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      env:
        SBUILD_STAGES: project
      run: |
        sh djv/etc/macOS/sbuild.sh djv Debug ci-macos

    # The runner has no working OpenGL, which djv-test does not need.
    - name: Run tests
      run: |
        cd build-Debug
        ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug


  macos-build-python:
    runs-on: macos-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Debug
        key: deps-${{ runner.os }}-${{ runner.arch }}-Debug-ci-macos-python-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/macOS/sbuild.sh') }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      env:
        SBUILD_STAGES: deps
      run: |
        sh djv/etc/macOS/sbuild.sh djv Debug ci-macos-python

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Debug
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      env:
        SBUILD_STAGES: project
      run: |
        sh djv/etc/macOS/sbuild.sh djv Debug ci-macos-python

    # The runner has no working OpenGL, which djv-test does not need.
    - name: Run tests
      run: |
        cd build-Debug
        ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug
  # Both architectures on the one kind of runner: the Intel package is cross
  # compiled, as it is in a release made by hand. Neither is signed. The
  # signing identity is not kept here; etc/macOS/sign-release.sh signs and
  # notarizes these on the machine that has it.
  macos-package:
    name: macos-package (${{ matrix.arch }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, config: package-macos }
          - { arch: x86_64, config: package-macos-x64 }

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Release
        key: deps-${{ runner.os }}-${{ runner.arch }}-Release-${{ matrix.config }}-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/macOS/sbuild.sh') }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Setup environment
      run: |
        echo "$PWD/install-Release/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PWD/install-Release/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      env:
        SBUILD_STAGES: deps
      run: |
        sh djv/etc/macOS/sbuild.sh djv Release ${{ matrix.config }}

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Release
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      env:
        SBUILD_STAGES: project
      run: |
        sh djv/etc/macOS/sbuild.sh djv Release ${{ matrix.config }}

    - name: Package
      run: |
        cmake --build build-Release --config Release --target package

    # Named for the architecture it is for, which the Intel one is not
    # built on.
    - name: Check the package
      run: |
        ls build-Release/djv-*-macos-${{ matrix.arch }}.dmg

    - uses: actions/upload-artifact@v7
      with:
        name: DJV-macOS-${{ matrix.arch }}-Packages
        path: build-Release/djv-*.dmg
        archive: false

  windows-build:
    runs-on: windows-latest

    env:
      # The Windows runners have four cores for a public repository, as the
      # others do.
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Debug
        key: deps-${{ runner.os }}-${{ runner.arch }}-Debug-ci-windows-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/Windows/sbuild.bat') }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: ilammy/setup-nasm@v1
      if: steps.deps.outputs.cache-hit != 'true'
    # FFmpeg builds with MSYS2: a fresh one from its GitHub release, with the
    # packages the build needs, kept between runs. The build would otherwise
    # download them from the package mirror every time, and the mirror has
    # been the thing to fail.
    - uses: msys2/setup-msys2@v2
      if: steps.deps.outputs.cache-hit != 'true'
      id: msys2
      with:
        msystem: MSYS
        install: diffutils make nasm pkgconf

    # \bug Any spaces before the ">>" will be considered part of the path.
    - name: Setup environment
      shell: cmd
      run: |
        echo %CD%\install-Debug\bin>> %GITHUB_PATH%
        echo %CD%\install-Debug\lib>> %GITHUB_PATH%
        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version
        
    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      shell: cmd
      env:
        SBUILD_STAGES: deps
        MSYS_INSTALL_PATH: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        djv\etc\Windows\sbuild.bat djv Debug ci-windows

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Debug
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      shell: cmd
      env:
        SBUILD_STAGES: project
      run: |
        djv\etc\Windows\sbuild.bat djv Debug ci-windows

    # The runner has no working OpenGL, which djv-test does not need.
    - name: Run tests
      shell: cmd
      run: |
        cd build-Debug
        ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug


  windows-build-python:
    runs-on: windows-latest

    env:
      # The Windows runners have four cores for a public repository, as the
      # others do.
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
    - uses: actions/checkout@v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: install-Debug
        key: deps-${{ runner.os }}-${{ runner.arch }}-Debug-ci-windows-python-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/Windows/sbuild.bat') }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: ilammy/setup-nasm@v1
      if: steps.deps.outputs.cache-hit != 'true'
    # FFmpeg builds with MSYS2: a fresh one from its GitHub release, with the
    # packages the build needs, kept between runs. The build would otherwise
    # download them from the package mirror every time, and the mirror has
    # been the thing to fail.
    - uses: msys2/setup-msys2@v2
      if: steps.deps.outputs.cache-hit != 'true'
      id: msys2
      with:
        msystem: MSYS
        install: diffutils make nasm pkgconf

    # \bug Any spaces before the ">>" will be considered part of the path.
    - name: Setup environment
      shell: cmd
      run: |
        echo %CD%\install-Debug\bin>> %GITHUB_PATH%
        echo %CD%\install-Debug\lib>> %GITHUB_PATH%
        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version
        
    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      shell: cmd
      env:
        SBUILD_STAGES: deps
        MSYS_INSTALL_PATH: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        djv\etc\Windows\sbuild.bat djv Debug ci-windows-python

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: install-Debug
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      shell: cmd
      env:
        SBUILD_STAGES: project
      run: |
        djv\etc\Windows\sbuild.bat djv Debug ci-windows-python

    # The runner has no working OpenGL, which djv-test does not need.
    - name: Run tests
      shell: cmd
      run: |
        cd build-Debug
        ctest --verbose --rerun-failed --output-on-failure --timeout 600 -C Debug
  windows-package:
    runs-on: windows-latest

    # The packages of a release are signed, and those of a run started by
    # hand that asks for it; a push is not, so that pushing is never held up
    # and the signing service sees only what is released. Signing is done by
    # Azure Artifact Signing: the key stays in Azure and nothing secret is
    # kept here. The job proves who it is with a token GitHub issues for the
    # run (OpenID Connect), which Azure accepts only from this repository's
    # "signing" environment, and the environment asks for a reviewer's
    # approval before the job starts. The identifiers the steps use are
    # variables of that environment, not secrets. See "Signing (Windows)" in
    # etc/Release.md.
    #
    # Every action in this job is pinned to a commit rather than a tag: a
    # tag can be moved, and whatever runs in this job can ask for the token
    # that signs. To update one, look up the commit its tag points to
    # (git ls-remote https://github.com/<owner>/<action> 'refs/tags/<tag>*')
    # and change the hash and the comment beside it together.
    environment: ${{ (github.ref_type == 'tag' || inputs.sign) && 'signing' || '' }}
    permissions:
      id-token: write
      contents: read

    env:
      # The Windows runners have four cores for a public repository, as the
      # others do.
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      SIGN: ${{ github.ref_type == 'tag' || inputs.sign }}

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        path: djv
        submodules: recursive

    # The installed dependencies are cached, keyed on what decides
    # them and this job's config; on a hit their build is skipped.
    - name: Restore dependencies
      id: deps
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: install-Release
        key: deps-${{ runner.os }}-${{ runner.arch }}-Release-package-windows-${{ hashFiles('djv/deps/tlRender/deps/ftk/etc/SuperBuild/**', 'djv/deps/tlRender/etc/SuperBuild/**', 'djv/etc/Config/**', 'djv/etc/Windows/sbuild.bat') }}

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
    - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      if: steps.deps.outputs.cache-hit != 'true'
    # FFmpeg builds with MSYS2: a fresh one from its GitHub release, with the
    # packages the build needs, kept between runs. The build would otherwise
    # download them from the package mirror every time, and the mirror has
    # been the thing to fail.
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
      if: steps.deps.outputs.cache-hit != 'true'
      id: msys2
      with:
        msystem: MSYS
        install: diffutils make nasm pkgconf

    # \bug Any spaces before the ">>" will be considered part of the path.
    - name: Setup environment
      shell: cmd
      run: |
        echo %CD%\install-Release\bin>> %GITHUB_PATH%
        echo %CD%\install-Release\lib>> %GITHUB_PATH%
        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version
        winget install NSIS.NSIS --accept-package-agreements --accept-source-agreements --disable-interactivity

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      shell: cmd
      env:
        SBUILD_STAGES: deps
        MSYS_INSTALL_PATH: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        djv\etc\Windows\sbuild.bat djv Release package-windows

    # Saved before the project is built and installed into the same
    # directory, so that the cache holds only the dependencies.
    - name: Save dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: install-Release
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Build
      shell: cmd
      env:
        SBUILD_STAGES: project
      run: |
        djv\etc\Windows\sbuild.bat djv Release package-windows

    # A run that is meant to sign and cannot is a failed run: an unsigned
    # package must not go out as a release because a variable was missing.
    - name: Check the signing variables
      if: env.SIGN == 'true'
      shell: pwsh
      run: |
        $missing = @()
        if ('${{ vars.AZURE_CLIENT_ID }}' -eq '') { $missing += 'AZURE_CLIENT_ID' }
        if ('${{ vars.AZURE_TENANT_ID }}' -eq '') { $missing += 'AZURE_TENANT_ID' }
        if ('${{ vars.AZURE_SUBSCRIPTION_ID }}' -eq '') { $missing += 'AZURE_SUBSCRIPTION_ID' }
        if ('${{ vars.AZURE_SIGNING_ENDPOINT }}' -eq '') { $missing += 'AZURE_SIGNING_ENDPOINT' }
        if ('${{ vars.AZURE_SIGNING_ACCOUNT }}' -eq '') { $missing += 'AZURE_SIGNING_ACCOUNT' }
        if ('${{ vars.AZURE_SIGNING_PROFILE }}' -eq '') { $missing += 'AZURE_SIGNING_PROFILE' }
        if ($missing.Count -gt 0) {
          Write-Host "::error::Not set in the signing environment: $($missing -join ', ')"
          exit 1
        }

    - name: Azure login
      if: env.SIGN == 'true'
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    # The programs first, so that the installer and the archive are made
    # from signed files; then the installer itself, below.
    - name: Sign the programs
      if: env.SIGN == 'true'
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
      with:
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: ${{ github.workspace }}\build-Release\bin
        # "com" as well: the console launcher is a program with that
        # extension, and was going out unsigned.
        files-folder-filter: exe,dll,com
        files-folder-recurse: true
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-cli-credential: false
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    # The uninstaller is made while the installer is compiled, by the
    # packaging step below, so it is signed there: with the signing tool and
    # the Artifact Signing client the step above put on the runner, and the
    # Azure login still current. See cmake/CPackProjectConfig.cmake.
    - name: Prepare to sign the uninstaller
      if: env.SIGN == 'true'
      shell: pwsh
      run: |
        $root = Join-Path $env:LOCALAPPDATA 'ArtifactSigning'
        $signtool = Get-ChildItem $root -Recurse -Filter signtool.exe |
          Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
        $dlib = Get-ChildItem $root -Recurse -Filter Azure.CodeSigning.Dlib.dll |
          Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
        if (-not $signtool -or -not $dlib) {
          Write-Host "::error::The signing tools are not under $root"
          exit 1
        }
        $metadata = Join-Path $env:RUNNER_TEMP 'signing-metadata.json'
        @{
          Endpoint = '${{ vars.AZURE_SIGNING_ENDPOINT }}'
          CodeSigningAccountName = '${{ vars.AZURE_SIGNING_ACCOUNT }}'
          CertificateProfileName = '${{ vars.AZURE_SIGNING_PROFILE }}'
          ExcludeCredentials = @(
            'EnvironmentCredential', 'WorkloadIdentityCredential',
            'ManagedIdentityCredential', 'SharedTokenCacheCredential',
            'VisualStudioCredential', 'VisualStudioCodeCredential',
            'AzurePowerShellCredential', 'AzureDeveloperCliCredential',
            'InteractiveBrowserCredential')
        } | ConvertTo-Json | Set-Content -Encoding utf8 $metadata
        $command = '"{0}" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib "{1}" /dmdf "{2}"' -f `
          $signtool.FullName, $dlib.FullName, $metadata
        Write-Host $command
        "DJV_NSIS_SIGN_COMMAND=$command" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

    - name: Package
      shell: cmd
      run: |
        cmake --build build-Release --config Release --target package

    - name: Sign the installer
      if: env.SIGN == 'true'
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
      with:
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: ${{ github.workspace }}\build-Release
        files-folder-filter: djv-*.exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-cli-credential: false
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    # A signature that did not take is a failed run, not a quiet one: the
    # installer is what people download.
    - name: Check the signature
      if: env.SIGN == 'true'
      shell: pwsh
      run: |
        $failed = $false
        Get-ChildItem build-Release -Filter 'djv-*.exe' | ForEach-Object {
          $s = Get-AuthenticodeSignature $_.FullName
          Write-Host $_.Name $s.Status $s.SignerCertificate.Subject
          if ($s.Status -ne 'Valid') { $failed = $true }

          # The uninstaller only exists once the installer has run, so
          # install quietly here (the runner is thrown away) and check the
          # one it wrote, and the program it put in place.
          $dir = Join-Path $env:RUNNER_TEMP 'installed'
          Start-Process -Wait -FilePath $_.FullName -ArgumentList '/S', "/D=$dir"
          foreach ($f in @('Uninstall.exe', 'bin\djv.exe')) {
            $path = Join-Path $dir $f
            if (-not (Test-Path $path)) {
              Write-Host "::error::The installer did not write $f"
              $failed = $true
              continue
            }
            $s = Get-AuthenticodeSignature $path
            Write-Host $f $s.Status $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { $failed = $true }
          }
        }
        if ($failed) { exit 1 }

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: DJV-Windows-Packages
        path: |
          build-Release\djv-*.exe
          build-Release\djv-*.zip
        archive: true

  # A tag starts a release: a draft, with the packages that need nothing more
  # done to them and the change log's entry for the version. The macOS
  # packages are added by etc/macOS/sign-release.sh once they are signed, and
  # the draft is published by hand.
  release:
    if: github.ref_type == 'tag'
    needs: [linux-package, macos-package, windows-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    # Every package of this run, the unsigned macOS ones among them, which
    # are left out below.
    - uses: actions/download-artifact@v8
      with:
        path: packages
        merge-multiple: true

    - name: Draft the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ls -l packages
        # The entry between this version's heading and the next one.
        awk -v v="## $GITHUB_REF_NAME" '
          $0 == v { on = 1; next }
          /^## / { on = 0 }
          on' ChangeLog.md > notes.md
        cat notes.md
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" \
            packages/djv-*.tar.gz packages/djv-*.exe packages/djv-*.zip --clobber
        else
          gh release create "$GITHUB_REF_NAME" \
            packages/djv-*.tar.gz packages/djv-*.exe packages/djv-*.zip \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        fi
